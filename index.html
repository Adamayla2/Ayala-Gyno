<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4f6fb">
    <meta name="description" content="Comprehensive Obstetrics & Gynecology question bank with exam mode, bookmarking, and progress tracking.">
    <title>AYLA GYNO Master Question Bank</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AYLA GYNO">

    <style>
        :root {
            --bg: #f4f6fb;
            --surface: rgba(15, 23, 42, 0.035);
            --surface-hover: rgba(15, 23, 42, 0.06);
            --surface-strong: rgba(15, 23, 42, 0.09);
            --border: rgba(15, 23, 42, 0.10);
            --border-strong: rgba(15, 23, 42, 0.18);
            --border-glow: rgba(0, 212, 255, 0.25);
            --text: #0f172a;
            --text2: #475569;
            --text-muted: #64748b;
            --primary: #c43b78;
            --primary-light: #e56b9b;
            --primary-dark: #a52c62;
            --primary-glow: rgba(196, 59, 120, 0.35);
            --accent: #d9468a;
            --accent-light: #e879ad;
            --accent-glow: rgba(217, 70, 138, 0.35);
            --success: #047857;
            --success-glow: rgba(16, 185, 129, 0.35);
            --danger: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.35);
            --warning: #b45309;
            --warning-glow: rgba(245, 158, 11, 0.35);
            --shadow: 0 8px 32px rgba(15, 23, 42, 0.12);
            --shadow-lg: 0 12px 48px rgba(15, 23, 42, 0.16);
            --glow-primary: 0 0 40px rgba(196, 59, 120, 0.12);
            --glow-accent: 0 0 40px rgba(217, 70, 138, 0.12);
            --glass-rgb: 255, 255, 255;
            --radius: 20px;
            --radius-sm: 14px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --nav-height: 72px;
            --max-width: 900px;
            --card-gap: 16px;
        }

        .dark-mode {
            --bg: #0a0e1a;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --surface-strong: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text-muted: #64748b;
            --primary: #e56b9b;
            --primary-light: #f3a3c1;
            --primary-dark: #a52c62;
            --accent: #d9468a;
            --accent-light: #f08fba;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.6);
            --glass-rgb: 10, 14, 26;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(var(--nav-height) + 24px);
            user-select: none;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: 
                radial-gradient(ellipse at 15% 50%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, rgba(16, 185, 129, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(232, 148, 58, 0.03) 0%, transparent 40%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
        }

        .app-header {
            background: rgba(var(--glass-rgb), 0.75);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .logo::before {
            content: '🌸';
            font-size: 1.4rem;
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .offline-badge {
            font-size: 0.7rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-weight: 600;
        }

        .offline-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-glow);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .btn-icon:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
            color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-1px);
        }

        .btn-icon:active { transform: scale(0.92); }

        .main-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 18px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            will-change: transform;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: var(--card-gap);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg), var(--glow-primary);
            transform: translateY(-2px);
        }

        .card, .question-block, .stat-card {
            contain: layout paint;
        }

        .card-header {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border-radius: var(--radius-sm);
            padding: 18px 14px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.08);
            transform: translateY(-3px);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .stat-card:hover::after { opacity: 1; }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
            font-family: var(--font);
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::before { opacity: 1; }
        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.18), rgba(0, 212, 255, 0.08));
            border-color: rgba(0, 212, 255, 0.35);
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px var(--primary-glow), 0 4px 20px rgba(0, 212, 255, 0.2);
            border-color: var(--primary);
            color: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-accent {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(168, 85, 247, 0.08));
            border-color: rgba(168, 85, 247, 0.35);
            color: var(--accent-light);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.15);
        }

        .btn-accent:hover {
            box-shadow: 0 0 30px var(--accent-glow), 0 4px 20px rgba(168, 85, 247, 0.2);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border-strong);
            color: var(--text2);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(0, 212, 255, 0.05);
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(16, 185, 129, 0.08));
            border-color: rgba(16, 185, 129, 0.35);
            color: var(--success);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }

        .btn-success:hover {
            box-shadow: 0 0 30px var(--success-glow);
            border-color: var(--success);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.18), rgba(239, 68, 68, 0.08));
            border-color: rgba(239, 68, 68, 0.35);
            color: var(--danger);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15);
        }

        .btn-danger:hover {
            box-shadow: 0 0 30px var(--danger-glow);
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        .btn-warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(245, 158, 11, 0.08));
            border-color: rgba(245, 158, 11, 0.35);
            color: var(--warning);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        .btn-block { width: 100%; }
        .mt-2 { margin-top: 14px; }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-family: var(--font);
            font-size: 0.92rem;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text);
            margin-bottom: 10px;
            transition: all var(--transition);
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 20px var(--primary-glow);
            background: rgba(0, 0, 0, 0.3);
        }

        input::placeholder, textarea::placeholder { color: var(--text-muted); }

        label {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text2);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .question-block {
            will-change: transform;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
        }

        .question-block:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg), 0 0 30px rgba(0, 212, 255, 0.05);
        }

        .question-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            opacity: 0.6;
            border-radius: var(--radius) 0 0 var(--radius);
        }

        .question-text {
            font-weight: 700;
            font-size: 1.08rem;
            margin-bottom: 18px;
            line-height: 1.5;
            color: var(--text);
            padding-left: 8px;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            cursor: pointer;
            font-size: 0.95rem;
            transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border-color: var(--border-strong);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 212, 255, 0.04));
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow), inset 0 0 20px rgba(0, 212, 255, 0.05);
            color: var(--primary-light);
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(16, 185, 129, 0.04));
            border-color: var(--success);
            box-shadow: 0 0 25px var(--success-glow);
            color: var(--success);
            transform: translateX(4px);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(239, 68, 68, 0.04));
            border-color: var(--danger);
            box-shadow: 0 0 25px var(--danger-glow);
            color: var(--danger);
            transform: translateX(4px);
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            margin-right: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .option-btn.selected .option-label {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .option-btn.correct .option-label {
            background: var(--success);
            color: var(--bg);
            border-color: var(--success);
            box-shadow: 0 0 12px var(--success-glow);
        }

        .option-btn.wrong .option-label {
            background: var(--danger);
            color: var(--bg);
            border-color: var(--danger);
            box-shadow: 0 0 12px var(--danger-glow);
        }

        .explanation-box {
            margin-top: 16px;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.06), rgba(0, 212, 255, 0.02));
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            border-left: 4px solid var(--primary);
            font-size: 0.92rem;
            color: var(--text2);
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            border-right: 1px solid rgba(0, 212, 255, 0.1);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid;
        }

        .badge-primary {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary);
            border-color: rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.08);
        }

        .badge-accent {
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent-light);
            border-color: rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.08);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.25);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border-color: rgba(245, 158, 11, 0.25);
        }

        .badge-group {
            background: rgba(108, 92, 231, 0.1);
            color: #a78bfa;
            border-color: rgba(139, 92, 246, 0.25);
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary-glow);
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .timer-warning {
            color: var(--warning);
            text-shadow: 0 0 30px var(--warning-glow);
            animation: pulse-warning 1s infinite;
        }

        .timer-danger {
            color: var(--danger);
            text-shadow: 0 0 30px var(--danger-glow);
            animation: pulse-danger 0.6s infinite;
        }

        @keyframes pulse-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes pulse-danger {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin: 12px 0;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary-light));
            background-size: 200% 100%;
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--primary-glow);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(var(--glass-rgb), 0.92);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
            height: var(--nav-height);
            padding: 0 10px;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 600;
            border: none;
            background: none;
            position: relative;
            transition: all var(--transition);
            padding-top: 8px;
        }

async function populateDeleteBookDropdown(){
 const sel=document.getElementById('deleteGroupName');
 if(!sel) return;
 const groups=await db.getAllGroups();
 sel.innerHTML='<option value="">Select Book</option>'+groups.map(g=>`<option value="${g}">${g}</option>`).join('');
}
setTimeout(populateDeleteBookDropdown,300);


document.addEventListener('click', async (e)=>{
 if(e.target.id==='btnExamFromMistakes'){
   const perf=await db.getPerformance();
   const latest={}; perf.forEach(x=>latest[x.questionId]=x.correct);
   const wrongIds=Object.keys(latest).filter(k=>latest[k]===false).map(Number);
   const qs=(await db.getAllQuestions()).filter(q=>wrongIds.includes(q.id));
   AppState._examSaved=false;
   AppState.examQuestions=qs;
   AppState.examAnswers={currentIndex:0};
   AppState.examInProgress=true;
   AppState.examStartTime=Date.now();
   renderViewSafely('exam');
 }
 if(e.target.classList.contains('add-hy')){
   await db.toggleHighYield(Number(e.target.dataset.qid));
   showToast('Added to High Yield','success');
   renderViewSafely('mistakes');
 }
 if(e.target.classList.contains('retry-question')){
   const qid=Number(e.target.dataset.qid);
   const q=await db.getQuestion(qid);
   if(!q) return;
   AppState.studyQuestions=[q];
   AppState.studyIndex=0;
   AppState.studyAnswers={};
   AppState.studyRevealed={};
   navigateTo('study');
   setTimeout(()=>renderStudyQuestion(),100);
 }
 if(e.target.classList.contains('remove-hy')){
   const qid=Number(e.target.dataset.qid);
   await db.toggleHighYield(qid);
   showToast('Removed from High Yield', 'success');
   renderViewSafely('highyield');
 }
});


function updateAvailableQuestionsInfo(){
 try{
   const info=document.getElementById('availableQuestionsInfo');
   if(!info || !window.db) return;
   db.getAllQuestions().then(qs=>{
      const subjSel=document.getElementById('examSubject');
      const grpSel=document.getElementById('examBook');
      let filtered=[...qs];

      const subjects=subjSel?[...subjSel.selectedOptions].map(x=>x.value).filter(v=>v!=='all'):[];
      const groups=grpSel?[...grpSel.selectedOptions].map(x=>x.value).filter(v=>v!=='all'):[];

      if(subjects.length) filtered=filtered.filter(q=>subjects.includes(q.subject));
      if(groups.length) filtered=filtered.filter(q=>groups.includes(q.group));

      info.textContent='Available Questions: '+filtered.length;
   });
 }catch(e){}
}
document.addEventListener('change',e=>{
 if(e.target && (e.target.id==='examSubject' || e.target.id==='examBook')){
   updateAvailableQuestionsInfo();
 }
});


function populateExamChapters(){
 const subj=document.getElementById('examSubject');
 const chap=document.getElementById('examChapter');
 if(!subj||!chap) return;
 const selected=[...subj.selectedOptions].map(o=>o.value).filter(v=>v!=='all');
 let chapters=[];
 if(selected.length===0){ chapters=ALL_CHAPTERS; }
 else{
   selected.forEach(s=>{ if(GYNO_CURRICULUM[s]) chapters.push(...GYNO_CURRICULUM[s]); });
 }
 chap.innerHTML='<option value="all">All</option>'+
   [...new Set(chapters)].sort().map(c=>`<option value="${c}">${c}</option>`).join('');
}

document.addEventListener('change',function(e){
 if(e.target && e.target.id==='examSubject'){
   populateExamChapters();
   if(typeof updateAvailableQuestionsInfo==='function') updateAvailableQuestionsInfo();
 }
});

document.addEventListener('change',function(e){
 if(e.target && (e.target.id==='examChapter' || e.target.id==='examTopic')){
   if(typeof updateAvailableQuestionsInfo==='function') updateAvailableQuestionsInfo();
 }
});


async function populateExamTopics(){
 const chapter=document.getElementById('examChapter');
 const topic=document.getElementById('examTopic');
 if(!chapter || !topic) return;
 const qs=await db.getAllQuestions();
 let filtered=qs;
 if(chapter.value!=='all'){
   filtered=filtered.filter(q=>(q.chapter||'General')===chapter.value);
 }
 const topics=[...new Set(filtered.map(q=>q.topic).filter(Boolean))].sort();
 topic.innerHTML='<option value="all">All</option>'+topics.map(t=>`<option value="${t}">${t}</option>`).join('');
}

async function updateExamCounters(){
 const info=document.getElementById('availableQuestionsInfo');
 if(!info) return;
 const qs=await db.getAllQuestions();
 info.innerHTML='Total Questions: '+qs.length;
}

document.addEventListener('change',async function(e){
 if(e.target && e.target.id==='examChapter'){
   await populateExamTopics();
 }
});

document.addEventListener('DOMContentLoaded',function(){
 setTimeout(()=>{
   if(typeof populateExamChapters==='function') populateExamChapters();
   if(typeof updateExamCounters==='function') updateExamCounters();
 },500);
});

async function restoreAutoBackup(){

<script>
(function(){
const originalSubmitExam = window.submitExam;
if(originalSubmitExam){
 window.submitExam=function(){
   try{
      const results=(window.AppState&&AppState.lastExamResults)?AppState.lastExamResults:[];
      results.forEach(r=>{
        if(r && r.correct===false){
          let wrong=JSON.parse(localStorage.getItem('wrongQuestions')||'[]');
          if(!wrong.includes(r.id)) wrong.push(r.id);
          localStorage.setItem('wrongQuestions',JSON.stringify(wrong));
        }
      });
      if(window.AppState){
        const score=results.filter(r=>r.correct).length;
        if(typeof saveExamResult==='function'){
           saveExamResult(score,results.length);
        }
      }
      if(typeof clearExamProgressAuto==='function') clearExamProgressAuto();
      if(typeof clearExamSession==='function') clearExamSession();
   }catch(e){console.error(e);}
   return originalSubmitExam.apply(this,arguments);
 }
}
document.addEventListener('click',function(e){
 const opt=e.target.closest('[data-option]');
 if(!opt || !window.AppState) return;
 try{
   const idx=AppState.examAnswers.currentIndex||0;
   const q=AppState.examQuestions[idx];
   if(q){
      entSaveAnswer(q.id,opt.dataset.option);
      saveExamProgressAuto({
         currentIndex:idx,
         answers:AppState.examAnswers
      });
   }
 }catch(err){}
});
})();
</script>
